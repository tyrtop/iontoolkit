# the API's timestamp unit varies by field

views:
  - name: Overview
    endpoints:
      - name: el
        path: /sdwan/v3.2/api/elements/{element_id}
      - name: st
        path: /sdwan/v2.6/api/elements/{element_id}/status
    fetch:
      el: el
      st: st
    sections:
      - title: Device
        rows:
          - label: Name
            value: "{{ .el.name }}{{ with .el.description }} — {{ . }}{{ end }}"
          - label: Model
            value: "{{ .el.model_name }} · {{ .el.software_version }}"
          - label: Serial
            value: "{{ dash .el.serial_number }}"
          - label: Role
            value: "{{ .el.role }}{{ with .el.allowed_roles }} (allowed: {{ join . \", \" }}){{ end }}"
          - label: State
            value: "{{ .el.state }}{{ if .el.connected }} · connected{{ else }} · not connected{{ end }}"
          - label: Mode
            value: "{{ dash .st.device_mode }}"
          - label: FIPS
            value: "{{ dash .el.fips_mode }}"
          - label: Tags
            value: "{{ with .el.tags }}{{ join . \", \" }}{{ end }}"

      - title: Controller
        rows:
          - label: Rebooted
            value: "{{ utc .st.last_rebooted_time }} ({{ ago .st.last_rebooted_time }}){{ with .st.last_rebooted_info }} — {{ . }}{{ end }}"
          - label: Config
            value: "{{ if .st.config_and_events_connected }}up since {{ utc .st.config_and_events_connected_on_utc }} ({{ ago .st.config_and_events_connected_on_utc }}){{ else }}down since {{ utc .st.config_and_events_disconnected_on_utc }}{{ end }} · {{ dash .st.config_and_events_from }}"
          - label: Analytics
            value: "{{ if .st.analytics_live_connected }}up{{ else }}down{{ end }} · {{ dash .st.analytics_live_from }}"
          - label: Flows
            value: "{{ if .st.flows_live_connected }}up{{ else }}down{{ end }} · {{ dash .st.flows_live_from }}"
          - label: Logs
            value: "{{ if .st.logs_live_connected }}up{{ else }}down{{ end }} · {{ dash .st.logs_live_from }}"
          # the backlog channels connect, drain and drop, so they read disconnected

      - title: HA
        when: "{{ .el.spoke_ha_config.cluster_id }}"
        rows:
          - label: Cluster
            value: "{{ .el.spoke_ha_config.cluster_id }}"
          - label: Priority
            value: "{{ .el.spoke_ha_config.priority }}{{ if not .el.spoke_ha_config.enable }} (disabled){{ end }}"
          - label: Tracking
            value: "{{ count .el.spoke_ha_config.track.interfaces }} interface(s)"

    # the CLI key names are guesses: `dump device status` has never been captured
    compare:
      fetch:
        el: el
      commands:
        dev: dump device status
      rows:
        - label: Serial
          portal: "{{ .el.serial_number }}"
          device: "{{ kv .cli.dev \"Serial\" }}"
        - label: Model
          portal: "{{ .el.model_name }}"
          device: "{{ kv .cli.dev \"Model\" }}"
        - label: Software
          portal: "{{ .el.software_version }}"
          device: "{{ kv .cli.dev \"Version\" }}"

  - name: Interfaces
    endpoints:
      - name: ifs
        path: /sdwan/v4.21/api/sites/{site_id}/elements/{element_id}/interfaces
      - name: wans
        path: /sdwan/v2.10/api/sites/{site_id}/waninterfaces
      - name: zones
        path: /sdwan/v2.2/api/securityzones
      - name: elzones
        path: /sdwan/v2.1/api/sites/{site_id}/elements/{element_id}/securityzones
      - name: st
        path: /sdwan/v3.9/api/sites/{site_id}/elements/{element_id}/interfaces/{item.id}/status
    fetch:
      ifs: ifs
      wans: wans
      # zone field names are read off the resource map, never seen on hardware
      zones: zones
      elzones: elzones
    sections:
      - title: Interfaces
        for_each: ifs.items
        empty: this element has no interfaces
        fetch:
          st: st
        columns:
          - header: PORT
            value: "{{ .item.name }}"
            width: 24
          - header: TYPE
            value: "{{ .item.type }}"
            width: 12
          - header: USED FOR
            value: "{{ .item.used_for }}"
            width: 8
          - header: STATE
            value: "{{ (unwrap .st).operational_state }}{{ with (unwrap .st).extended_state }} ({{ . }}){{ end }}"
            width: 18
          # the record's mac_address is null on every interface hardware answered
          - header: MAC
            value: "{{ dash (unwrap .st).mac_address }}"
            width: 17
          - header: ADDRESS
            value: "{{ dash (first (unwrap .st).ipv4_addresses) }}"
            width: 18
          # the record says how the address was asked for, not what came up
          - header: CONFIG
            value: "{{ with .item.ipv4_config }}{{ dash .type }}{{ else }}-{{ end }}"
            width: 7
          - header: LINK
            value: "{{ with (unwrap .st).port }}{{ if .connected }}{{ .speed }}M{{ if .full_duplex }} full{{ end }}{{ else }}no carrier{{ end }}{{ end }}"
            width: 11
          - header: CIRCUIT
            value: "{{ range .item.site_wan_interface_ids }}{{ with lookup $.wans.items \"id\" . }}{{ .name }} {{ end }}{{ end }}"
            width: 20
          - header: ZONE
            value: "{{ with lookup $.elzones.items \"interface_ids\" .item.id }}{{ with lookup $.zones.items \"id\" .zone_id }}{{ .name }}{{ end }}{{ end }}"
            width: 32

  - name: Circuits
    endpoints:
      - name: wans
        path: /sdwan/v2.10/api/sites/{site_id}/waninterfaces
      - name: ifs
        path: /sdwan/v4.21/api/sites/{site_id}/elements/{element_id}/interfaces
      - name: labels
        path: /sdwan/v2.6/api/waninterfacelabels
      - name: networks
        path: /sdwan/v2.1/api/wannetworks
      - name: st
        path: /sdwan/v2.1/api/sites/{site_id}/waninterfaces/{item.id}/status
      - name: state
        path: /sdwan/v2.1/api/sites/{site_id}/elements/{element_id}/waninterfaces/{item.id}/state
    fetch:
      wans: wans
      ifs: ifs
      labels: labels
      networks: networks
    sections:
      - title: Circuits
        for_each: wans.items
        empty: this site has no circuits
        fetch:
          # a circuit can be up at the site while this element cannot use it
          st: st
          state: state
        columns:
          - header: CIRCUIT
            value: "{{ dash .item.name }}"
            width: 26
          - header: LABEL
            value: "{{ with lookup $.labels.items \"id\" .item.label_id }}{{ .name }}{{ end }}"
            width: 20
          - header: NETWORK
            value: "{{ with lookup $.networks.items \"id\" .item.network_id }}{{ .name }}{{ end }}"
            width: 20
          - header: TYPE
            value: "{{ dash .item.type }}{{ if .item.use_for_controller_connections }} ctrl{{ end }}"
            width: 15
          - header: BW
            value: "{{ with .item.link_bw_down }}{{ . }}↓{{ end }}{{ with .item.link_bw_up }} {{ . }}↑{{ end }}"
            width: 12
          - header: PORT
            value: "{{ with lookup $.ifs.items \"site_wan_interface_ids\" .item.id }}{{ .name }}{{ end }}"
            width: 16
          - header: STATUS
            value: "{{ with .st }}{{ dash .operational_state }}{{ end }}{{ with .state }} · {{ if .operational }}operational{{ else }}not operational{{ end }}{{ if .disabled }} · disabled{{ end }}{{ end }}"

  - name: HA
    endpoints:
      - name: el
        path: /sdwan/v3.2/api/elements/{element_id}
      - name: cl
        path: /sdwan/v2.0/api/sites/{site_id}/spokeclusters/{cluster_id}/status
    fetch:
      el: el
      cl: cl
    sections:
      - title: Cluster
        when: "{{ .cluster_id }}"
        rows:
          - label: Cluster
            value: "{{ .cluster_id }}"
          - label: This ION
            value: "priority {{ .el.spoke_ha_config.priority }}, tracking {{ count .el.spoke_ha_config.track.interfaces }} interface(s)"
          - label: Members
            value: "{{ count .cl.cluster_members }}"

      - title: Members
        when: "{{ .cluster_id }}"
        for_each: cl.cluster_members
        empty: the cluster reported no members
        columns:
          - header: ELEMENT
            value: "{{ .item.element_id }}"
            width: 22
          - header: STATUS
            value: "{{ .item.status }}"

      # API sends newest first; adjustments explain effective vs configured priority
      - title: Switchovers
        when: "{{ .cluster_id }}"
        for_each: cl.switch_over_events
        empty: no switchovers recorded
        max_items: 12
        columns:
          - header: WHEN
            value: "{{ utc .item.switch_over_time }}"
            width: 18
          - header: ELEMENT
            value: "{{ .item.element_id }}"
            width: 22
          - header: ACTIVE
            value: "{{ yesno .item.active }}"
            width: 7
          - header: PRIORITY
            value: "{{ .item.effective_priority }}"
            width: 9
          - header: PEER
            value: "{{ if .item.peer_connected }}connected{{ else }}not connected{{ end }}"
            width: 14
          - header: WHY
            value: "{{ range .item.adjustments }}-{{ .adjustment }} {{ .kind }} {{ .name }} {{ end }}"

    # `dump spoke-ha status` has never been captured either
    compare:
      when: "{{ .cluster_id }}"
      fetch:
        cl: cl
      commands:
        ha: dump spoke-ha status
      rows:
        - label: Active
          portal: "{{ with lookup .cl.cluster_members \"element_id\" .element_id }}{{ .status }}{{ end }}"
          device: "{{ kv .cli.ha \"State\" }}"
        - label: Priority
          portal: "{{ with lookup .cl.switch_over_events \"element_id\" .element_id }}{{ .effective_priority }}{{ end }}"
          device: "{{ kv .cli.ha \"Priority\" }}"
