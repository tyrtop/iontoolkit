writes:
  - name: interface
    title: Interface
    endpoints:
      - name: interfaces
        path: /sdwan/v4.21/api/sites/{site_id}/elements/{element_id}/interfaces
      # no HAR yet shows the portal saving an interface; PUT is a guess
      - name: interface
        method: PUT
        path: /sdwan/v4.21/api/sites/{site_id}/elements/{element_id}/interfaces/{item.id}
    list: interfaces
    item: interface
    label: "{{ .item.name }}{{ with .item.description }} · {{ . }}{{ end }}"
    match: name
    fields:
      - key: description
        label: Description
      - key: admin_up
        label: Admin up
        type: bool
      - key: mtu
        label: MTU
        type: int
      - key: tags
        label: Tags
        type: list
