kind: list
name: Elements

endpoints:
  - name: elements
    path: /sdwan/v3.2/api/elements
  - name: sites
    path: /sdwan/v4.13/api/sites
  - name: spokecluster_status
    path: /sdwan/v2.0/api/sites/{site_id}/spokeclusters/{cluster_id}/status
  - name: spokeclusters_status_query
    method: POST
    path: /sdwan/v2.0/api/spokeclusters/status/query

columns:
  - name: caret
    go: caret
    min: 2
    max: 2

  - name: status
    go: status
    min: 3
    max: 3

  - name: name
    header: Element
    mark: true
    min: 14
    max: 30
    flex: true
    fetch: elements
    value: "{{ .label }}"

  - name: site
    header: Site
    min: 8
    max: 22
    flex: true
    fetch: sites
    on: site_id
    value: "{{ .name }}"

  - name: model
    header: Model
    min: 8
    max: 11
    flex: true
    fetch: elements
    value: "{{ .model_name }}"

  - name: sn
    header: SN
    min: 10
    max: 24
    flex: true
    when: "{{ .serials }}"
    fetch: elements
    value: "{{ .serial_number }}"

  - name: state
    header: State
    min: 9
    max: 9
    fetch: elements
    value: "{{ if .connected }}connected{{ else }}offline{{ end }}"
    style:
      - when: "{{ not .connected }}"
        role: err

  - name: ha
    header: HA
    go: ha
    min: 8
    max: 8
    when: "{{ .clustered }}"

  - name: tenant
    header: Tenant
    min: 8
    max: 20
    flex: true
    when: "{{ gt .tenants 1 }}"
    fetch: elements
    value: "{{ .tenant }}"
