# bg and fg go out as OSC 11 and 10, which take a hex only: an index there
# resolves to xterm's value, not the terminal's own. An index under 16 is
# remapped by the terminal's own theme.

themes:
  - name: classic
    blurb: your terminal's own 16 colors
    ok: "2"
    err: "1"
    warn: "3"
    cmd: "6"
    element: "4"
    row: "5"
    hot: "9"
    border: "3"
    divider: "8"
    spinner: minidot
    spinner_color: "5"
    tabs: ["7", "4", "6", "5", "12", "14", "13"]

  - name: vivid
    blurb: the bright 8, for a dark palette
    ok: "10"
    err: "9"
    warn: "11"
    cmd: "14"
    element: "12"
    row: "13"
    hot: "11"
    border: "11"
    divider: "8"
    bg: "#000000"
    fg: "#e4e4e4"
    spinner: jump
    spinner_color: "13"
    tabs: ["15", "12", "14", "13", "4", "6", "7"]

  - name: mono
    blurb: "no color: bold, faint, reverse"
    spinner: line
    mono: true

  - name: nord
    blurb: truecolor, downsampled if needed
    ok: "#a3be8c"
    err: "#bf616a"
    warn: "#ebcb8b"
    cmd: "#88c0d0"
    element: "#81a1c1"
    row: "#b48ead"
    hot: "#d08770"
    border: "#ebcb8b"
    divider: "#4c566a"
    bg: "#2e3440"
    fg: "#d8dee9"
    spinner: dot
    spinner_color: "#b48ead"
    tabs: ["#d8dee9", "#81a1c1", "#88c0d0", "#b48ead", "#5e81ac", "#8fbcbb", "#eceff4"]

  # after vim's own schemes, not ports of them
  - name: desert
    blurb: wheat and khaki on warm grey, after vim's desert
