    border: "#cd853f"
    divider: "#6b6b6b"
    bg: "#33302a"
    fg: "#f5deb3"
    spinner: ellipsis
    spinner_color: "#bdb76b"
    tabs: ["#f5deb3", "#87ceeb", "#b0c4de", "#d8bfd8", "#deb887", "#c0c0c0", "#add8e6"]

  - name: evening
    blurb: saturated accents on dark grey, after vim's evening
    ok: "#60ff60"
    err: "#ffa0a0"
    warn: "#ffff60"
    cmd: "#60ffff"
    element: "#80a0ff"
    row: "#ff80ff"
    hot: "#ffa500"
    border: "#ffff60"
    divider: "#4e4e4e"
    bg: "#333333"
    fg: "#ffffff"
    spinner: moon
