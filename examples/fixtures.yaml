# The responses below are invented, not captured off an appliance.

unknown_response: '% unknown command: {command}'

tenants:
  - name: Acme Co
    tsg_id: "000000000"
    users:
      - name: admin
        password: ion

    elements:
      - name: store-0003-rtr-01
        id: "1234567890123456789"
        model: ion 1200
        software: 6.5.1
        hw_id: FAKE0001
        site: Store 0003
        connected: true
        ha: true
        responses:
          "dump device status": |
            Serial     : FAKE0001
            Model      : ion 1200
            Version    : 6.5.1
            Uptime     : 4 days
          "dump spoke-ha status": |
            State      : active
            Priority   : 160
            Peer       : not connected
          "dump interface status 1": |
            1: up, 1000Mb/s, full duplex

      - name: store-0003-rtr-02
        model: ion 1200-s
        software: 6.3.4-b2
        site: Store 0003
        connected: true
        ha: true
        # an ion 1200-s on 6.3.4-b2 pages with this prompt and waits for a space
        pages: true
        page_lines: 20
        responses:
          help: |
            arping     send an ARP request
            dig        DNS lookup
            dump       show device state
            inspect    inspect a subsystem
            ping       send ICMP echo requests
            traceroute trace the route to a host

      - name: store-0100-rtr-01
        model: ion 3200
        site: Store 0100
        connected: false

  - name: Lab
    tsg_id: "111111111"
    elements:
      - name: lab-rtr-01
        model: ion 1200
        connected: true
        responses:
          "dump device status": |
            Serial     : FAKELAB1
            Uptime     : 10 minutes
