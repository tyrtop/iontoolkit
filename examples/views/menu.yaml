# The main menu, in the order it is drawn. A name on its own is the entry as
# iontk words it; give it a label to change what it says. The entries are
# elements, service-accounts, sign-in, refresh-token, macros, settings, quit.

kind: menu
name: Main Menu

entries:
  - elements
  - name: service-accounts
    label: Tenants
  - macros
  - settings
  - quit
