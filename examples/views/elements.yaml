# The element list. Copy to views/elements.yaml in the config directory, or
# press alt+e on the list. Every column names the call its value comes from:
# `fetch:` is the path, `value:` renders over the answer. Two of the paths are
# the ones the list is built from anyway -- elements and sites -- so a column
# reading either of those costs no extra call, and changing them here changes
# what iontk asks for.
#
# A path with an id in it, like {element_id}, is read per element: `bulk:` is
# the query form that asks about 200 at a time and `key:` ties a row of the
# answer back to an element. A path with no id is read once for the fleet and
# joined, `key:` naming the field in the answer and `on:` the field on the
# element it matches.
#
# `go:` is for the three iontk works out rather than reads: the caret, the
# status glyph and the HA state. `when:` drops a column on a fleet with no use
# for it (elements, tenants, serials, clustered). `from: element` is the short
# way to read the record the list already has without naming its path.

kind: list
name: Elements

columns:
  - name: caret
    go: caret
    min: 2
    max: 2

  - name: status
    go: status
    min: 3
    max: 3

  - name: name
    header: Element
    mark: true
    min: 14
    max: 30
    flex: true
    fetch: /sdwan/v3.2/api/elements
    value: "{{ .label }}"

  - name: site
    header: Site
    min: 8
    max: 22
    flex: true
    fetch: /sdwan/v4.13/api/sites
    on: site_id
    value: "{{ .name }}"

  - name: model
    header: Model
    min: 8
    max: 11
    flex: true
    fetch: /sdwan/v3.2/api/elements
    value: "{{ .model_name }}"

  - name: sn
    header: SN
    min: 10
    max: 24
    flex: true
    when: "{{ .serials }}"
    fetch: /sdwan/v3.2/api/elements
    value: "{{ .serial_number }}"

  - name: state
    header: State
    min: 9
    max: 9
    fetch: /sdwan/v3.2/api/elements
    value: "{{ if .connected }}connected{{ else }}offline{{ end }}"
    style:
      - when: "{{ not .connected }}"
        role: err

  - name: ha
    header: HA
    go: ha
    min: 8
    max: 8
    when: "{{ .clustered }}"

  - name: tenant
    header: Tenant
    min: 8
    max: 20
    flex: true
    when: "{{ gt .tenants 1 }}"
    fetch: /sdwan/v3.2/api/elements
    value: "{{ .tenant }}"

  - name: version
    header: Software
    min: 8
    max: 10
    fetch: /sdwan/v3.2/api/elements
    value: "{{ .software_version }}"
    style:
      - when: "{{ not .connected }}"
        role: dim

  - name: booted
    header: Booted
    min: 9
    max: 14
    fetch: /sdwan/v2.6/api/elements/{element_id}/status
    bulk: POST /sdwan/v2.6/api/elements/status/query
    key: element_id
    value: "{{ ago .last_rebooted_time }}"

  - name: ha_priority
    header: Priority
    min: 8
    max: 8
    fetch: /sdwan/v3.2/api/elements
    value: "{{ with .spoke_ha_config }}{{ .priority }}{{ end }}"
