name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-linux-amd64 ./cmd/iontk

      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-windows-amd64.exe ./cmd/iontk

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: iontk-builds
          path: dist/
