name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Generate flag docs
        # *.md is gitignored, so docs/flags.md is built here instead of being
        # committed. Generation fails if a flag belongs to no group, which is
        # the part worth checking.
        run: go generate ./...

      - name: Upload flag docs
        uses: actions/upload-artifact@v4
        with:
          name: iontk-flag-docs
          path: docs/flags.md

      - name: Test
        # Xvfb where the image has it, since Discover's first sign-in opens a
        # real window and chromedp will not without a display. Not required:
        # the browser test skips itself when there is no DISPLAY.
        #
        # -p 1 because two packages reach config.DebugRoot(), one fixed path
        # shared by every test binary.
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a go test -race -cover -p 1 -timeout 5m ./...
          else
            go test -race -cover -p 1 -timeout 5m ./...
          fi

      - name: Build Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-linux-amd64 ./cmd/iontk

      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-windows-amd64.exe ./cmd/iontk

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: iontk-builds
          path: dist/

