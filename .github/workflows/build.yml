name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover -timeout 5m ./...

      - name: Build Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-linux-amd64 ./cmd/iontk

      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/iontk-windows-amd64.exe ./cmd/iontk

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: iontk-builds
          path: dist/

