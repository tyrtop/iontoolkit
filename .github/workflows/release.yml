name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Linux
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/iontk-linux-amd64 ./cmd/iontk

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -o dist/iontk-windows-amd64.exe ./cmd/iontk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iontk-linux-amd64
            dist/iontk-windows-amd64.exe
          generate_release_notes: true
