name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        # -short, which is what broke the v0.5.0 release: the browser
        # integration test drove chromedp on the runner, Chrome never came up,
        # and 45s later the tag had no binaries. A release gate must not depend
        # on whether a browser starts on a VM -- the full suite, that test
        # included, runs in build.yml on every push to master, so the commit
        # being tagged has already been through it.
        #
        # -p 1 because two packages reach config.DebugRoot(), one fixed path
        # shared by every test binary; run in parallel they clear each other's
        # store and the release fails at random.
        run: go test -short -p 1 -timeout 5m ./...

      - name: Build Linux
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/iontk-linux-amd64 ./cmd/iontk

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/iontk-windows-amd64.exe ./cmd/iontk

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # Generated here rather than via the action's generate_release_notes:
      # on a re-run the action finds the existing release and appends a fresh
      # copy of the notes to the body it already has. A body_path replaces it.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION" --jq .body > notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
